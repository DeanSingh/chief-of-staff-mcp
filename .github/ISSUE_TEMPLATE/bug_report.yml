name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, `bun --version`, and Claude Code CLI or Claude Desktop version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from ~/.claude-peers.log. Remove anything private first.
      render: text
